<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Hearth &amp; Crumb — final logo</title>
  <desc id="desc">A warm artisan bread mark with a hand-drawn steam line and a serif wordmark for a neighbourhood bakery.</desc>

  <!-- mark: cream disc, espresso linework, golden loaf -->
  <circle cx="200" cy="200" r="132" fill="#F6E7D3"/>
  <circle cx="200" cy="200" r="132" fill="none" stroke="#2B1B12" stroke-width="8"/>

  <!-- steam -->
  <path d="M168 116c-18-22 18-36 0-58" fill="none" stroke="#2B1B12" stroke-width="9" stroke-linecap="round"/>
  <path d="M200 106c-18-22 18-36 0-58" fill="none" stroke="#2B1B12" stroke-width="9" stroke-linecap="round"/>
  <path d="M232 116c-18-22 18-36 0-58" fill="none" stroke="#2B1B12" stroke-width="9" stroke-linecap="round"/>

  <!-- loaf -->
  <path d="M120 232c14-54 46-82 80-82s66 28 80 82c5 20-8 38-29 38H149c-21 0-34-18-29-38z" fill="#E8B04B" stroke="#2B1B12" stroke-width="8" stroke-linejoin="round"/>
  <path d="M166 200c8 18 8 38 0 58M200 190c8 22 8 46 0 68M234 200c8 18 8 38 0 58" fill="none" stroke="#2B1B12" stroke-width="7" stroke-linecap="round"/>

  <!-- wheat sprig -->
  <path d="M292 268c18-8 32-24 36-46" fill="none" stroke="#2B1B12" stroke-width="6" stroke-linecap="round"/>
  <path d="M314 246c-12-2-20-10-22-22M322 232c-12-2-20-10-22-22M328 218c-10-4-16-12-16-24" fill="none" stroke="#2B1B12" stroke-width="5" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="392" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="4" fill="#2B1B12">HEARTH &amp; CRUMB</text>
  <path d="M394 222h556" fill="none" stroke="#E8B04B" stroke-width="6" stroke-linecap="round"/>
  <text x="396" y="268" font-family="Verdana, Geneva, sans-serif" font-size="20" letter-spacing="9" fill="#E8B04B">ARTISAN BAKERY</text>
</svg>
