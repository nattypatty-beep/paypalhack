name: Bug report
description: Report a reproducible problem with MandatePay.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security vulnerabilities, do **not** use this
        form: follow the security policy in `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact prompt, API request or UI action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Reset the demo
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: os-python
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.13.2
    validations:
      required: true
  - type: dropdown
    id: paypal-mode
    attributes:
      label: PayPal mode
      options:
        - mock
        - sandbox
        - live
    validations:
      required: true
  - type: dropdown
    id: llm
    attributes:
      label: LLM configured?
      options:
        - "No (rules engine)"
        - OpenAI-compatible
        - Anthropic
        - Ollama
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, tokens, emails and personal data first.
    validations:
      required: false
