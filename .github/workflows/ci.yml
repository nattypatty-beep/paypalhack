name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q app tests scripts

      - name: Test
        run: python -m pytest

      - name: Smoke test (mock mode)
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8011 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8011/api/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/smoke.py --base-url http://127.0.0.1:8011

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mandatepay:ci

      - name: Run container and smoke test
        run: |
          if ! docker run -d --name mandatepay -p 8012:8000 mandatepay:ci; then
            docker ps -a
            exit 1
          fi
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8012/api/health; then ready=1; break; fi
            sleep 1
          done
          echo "health_ready=$ready"
          docker ps -a
          docker logs mandatepay || true
          if [ "$ready" -ne 1 ]; then exit 1; fi
          python scripts/smoke.py --base-url http://127.0.0.1:8012
          docker rm -f mandatepay

      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker inspect mandatepay || true
          docker logs mandatepay || true
