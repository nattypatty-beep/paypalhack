# Render blueprint for a public MandatePay demo.
#
# Default: deterministic mock PayPal + rules engine. No credentials are needed,
# and no real or sandbox money is ever called.
#
# The free plan is fine for a hackathon demo, but /data is ephemeral: the demo
# database resets whenever Render restarts or redeploys the service. To keep
# state, switch to a paid instance and uncomment the disk block below.
services:
  - type: web
    name: mandatepay
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATA_DIR
        value: /data
      # Guarantees the deterministic mock: no sandbox or live PayPal calls.
      - key: PAYPAL_FORCE_MOCK
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      # Hard block on live money. Keep this false.
      - key: ALLOW_LIVE
        value: "false"
      # Optional: make the demo private. Uncomment both and set a password.
      # - key: BASIC_AUTH_USER
      #   value: judge
      # - key: BASIC_AUTH_PASSWORD
      #   sync: false
      # Optional: real PayPal sandbox. Uncomment these, set
      # PAYPAL_FORCE_MOCK=false, and add the values in the Render dashboard.
      # - key: PAYPAL_CLIENT_ID
      #   sync: false
      # - key: PAYPAL_CLIENT_SECRET
      #   sync: false
      # - key: PAYPAL_WEBHOOK_ID
      #   sync: false
      # - key: PAYPAL_PAYOUTS_ENABLED
      #   value: "true"
      # - key: FREELANCER_NAME
      #   value: Avery Quinn
      # - key: FREELANCER_EMAIL
      #   sync: false
      # Optional: AI planner/verifier. Uncomment and fill in the dashboard.
      # - key: LLM_PROVIDER
      #   sync: false
      # - key: LLM_API_KEY
      #   sync: false
      # - key: LLM_MODEL
      #   sync: false
